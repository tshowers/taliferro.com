<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Payment Received — Tech Diagnosis | Taliferro</title>
  <link rel="canonical" href="https://taliferro.com/rescue-me/thank-you/" />
  <!-- Old post-payment URL (direct Stripe link). Forwards to the current thank-you page's intake version, keeping query params such as session_id. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (!p.has('flow')) p.set('flow', 'intake');
      location.replace('/rescue-me/thank-you/?' + p.toString());
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/rescue-me/thank-you/?flow=intake" />
</head>
<body>
  <p>Payment received. <a href="/rescue-me/thank-you/?flow=intake">Continue to your next step</a>.</p>
</body>
</html>
